name: Update NHL Data (Python)

# Python port of the NHL data reshaper (python/nhl_data_build). Reads the per-game
# final.json from fastRhockey-nhl-raw, compiles the season-level datasets, and publishes
# them to the sportsdataverse-data nhl_* releases — the same outputs as the R daily_nhl.yml.
#
# This is the production reshaper (cutover from the R daily_nhl.yml, now de-scheduled).
# Validated at full-season scale: pbp byte-exact vs the released nhl_pbp_full, shootout
# exact (590 rows, 0 attempt-value mismatches), extract_all smoke-clean across all 17 seasons.
#
# Credential scoping: the cross-repo publish PAT (SDV_GH_TOKEN) is set only on the publish
# step; the external nhl-raw checkout sets persist-credentials:false.
#
# SECOND CALL SITE: scripts/daily_nhl_python_processor.sh runs the same two stages
# (nhl_data_build.season -> publish.publish_season) on the sdv-orch droplet. The stage
# sequence is duplicated on purpose -- the git/env plumbing genuinely differs (that script
# uses an absolute venv path because systemd's PATH has no `uv`, and commits per season).
# Change the stages in BOTH, or CI and the droplet will drift apart.
# Serialize every workflow in this repo that commits to it. Two runs in flight put
# one of them behind origin and its push is rejected -- and where the git calls
# are swallowed with no rc check, that lands as a GREEN job that published
# nothing. Worked examples: wehoop-wnba-data runs 32192069433 + 32192069566, and
# hoopR-nba-data run 32204419012, all on 2026-08-18/19.
#
# cancel-in-progress is FALSE on purpose -- these runs upload release assets, and
# cancelling mid-upload leaves a tag half-updated. Queue instead.
concurrency:
  group: ${{ github.repository }}-commit
  cancel-in-progress: false

on:
  schedule:
    # Mirrors the retired daily_nhl.yml cadence — 09:00 UTC, NHL season Oct-Apr + playoffs Apr-Jun.
    - cron: '0 9 * 10-12 *'
    - cron: '0 9 * 1-4 *'
    - cron: '0 9 * 5-6 *'
  workflow_dispatch:
    inputs:
      start_year:
        description: 'Start season end-year (e.g. 2025 for 2024-25)'
        required: false
        type: string
      end_year:
        description: 'End season end-year (default: start)'
        required: false
        type: string
      publish:
        description: 'Publish parquet datasets to sportsdataverse-data releases'
        required: false
        type: boolean
        default: true
  repository_dispatch:
    types: [daily_nhl_data]

permissions:
  contents: write

jobs:
  nhl_data_python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - name: Checkout nhl-data
        uses: actions/checkout@v5
        with:
          persist-credentials: false  # the commit-back step authenticates the push explicitly

      # Track B: fetch this season's finals over HTTP (enumerated from the raw
      # repo's per-season schedule parquet) instead of sparse-checking-out the
      # ~22k-file final/ tree. Read-through cache, fail-soft per game.
      # The droplet driver (daily_nhl_python_processor.sh) keeps its local
      # checkout on purpose — its plumbing differs by design.
      - name: Fetch nhl-raw finals over HTTP
        run: |
          uv run python -m nhl_data_01_fetch \
            -s ${{ steps.years.outputs.start }} -e ${{ steps.years.outputs.end }} \
            --dest "$GITHUB_WORKSPACE/_raw/nhl/json/final"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync deps
        run: uv sync || uv pip install --system polars pyarrow numpy

      - name: Resolve season range
        id: years
        env:  # bind user inputs to env vars — never expand them into the shell source directly
          IN_START: ${{ github.event.inputs.start_year }}
          IN_END: ${{ github.event.inputs.end_year }}
          PAYLOAD_MSG: ${{ github.event.client_payload.commit_message }}
        run: |
          START="$IN_START"; END="$IN_END"

          # A repository_dispatch from nhl-raw carries the upstream commit subject, whose
          # first and last integers are the season range ("NHL Raw Updated (Start: 2026
          # End: 2026)"). Same parse the R workflow used — without it a dispatch silently
          # falls through to the date guess below, so a raw-side backfill of an older
          # season would compile the current one instead.
          if [ -z "$START" ] && [ -n "$PAYLOAD_MSG" ]; then
            START=$(printf '%s' "$PAYLOAD_MSG" | grep -o -E '[0-9]+' | head -1)
            END=$(printf '%s' "$PAYLOAD_MSG" | grep -o -E '[0-9]+' | tail -1)
          fi

          if [ -z "$START" ]; then
            Y=$(date +%Y); M=$(date +%m)
            START=$([ "$M" -ge 8 ] && echo $((Y + 1)) || echo "$Y")   # NHL season end-year
          fi
          END="${END:-$START}"

          # validate integers before any reuse (reject crafted values)
          case "$START" in ''|*[!0-9]*) echo "invalid start_year: $START" >&2; exit 1;; esac
          case "$END" in ''|*[!0-9]*) echo "invalid end_year: $END" >&2; exit 1;; esac
          # the grep above takes whatever integers the subject happens to contain, so
          # reject anything that isn't a plausible season end-year rather than compiling it
          for Y in "$START" "$END"; do
            if [ "$Y" -lt 2011 ] || [ "$Y" -gt 2100 ]; then
              echo "implausible season year: $Y (from '$PAYLOAD_MSG')" >&2; exit 1
            fi
          done
          [ "$START" -le "$END" ] || { echo "start $START after end $END" >&2; exit 1; }
          echo "start=$START" >> "$GITHUB_OUTPUT"; echo "end=$END" >> "$GITHUB_OUTPUT"

      - name: Compile season datasets
        run: |
          uv run python -m nhl_data_02_season \
            -s ${{ steps.years.outputs.start }} -e ${{ steps.years.outputs.end }} \
            --final-dir "$GITHUB_WORKSPACE/_raw/nhl/json/final" --out-dir "$GITHUB_WORKSPACE/nhl"

      - name: Publish to sportsdataverse-data releases
        if: ${{ github.event.inputs.publish != 'false' }}
        env:
          GH_TOKEN: ${{ secrets.SDV_GH_TOKEN }}
        run: |
          uv run python -m nhl_data_03_publish \
            -s ${{ steps.years.outputs.start }} -e ${{ steps.years.outputs.end }} \
            --out-dir "$GITHUB_WORKSPACE/nhl"

      - name: Commit compiled parquets
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add nhl
          git commit -m "ci(data): compile NHL datasets (Python) ${{ steps.years.outputs.start }}-${{ steps.years.outputs.end }}" || echo "no changes"
          # persist-credentials:false on checkout — authenticate the push explicitly so the
          # write token isn't left in the runner's git config for later steps to reuse.
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:${GITHUB_REF_NAME}" || echo "nothing to push"
