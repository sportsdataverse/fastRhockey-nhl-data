[project]
name = "nhl-data-build"
version = "0.0.1"
description = "Python port of the fastRhockey-nhl-data reshaper (final.json -> season datasets)"
requires-python = ">=3.10"
dependencies = [
    "polars>=1.0,<2.0",
    "pyarrow>=14.0",
    "numpy>=1.26",
]

[dependency-groups]
dev = ["pytest>=8.0"]
# xG model training (xg_train): xgboost + pandas (xgb.cv returns a pandas frame).
train = ["xgboost>=2.0", "pandas>=2.0"]
# optional feature-importance PNGs (xg_report.write_importance_figures).
figures = ["matplotlib>=3.7"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
