[project]
name = "nhl-data-build"
version = "0.0.1"
description = "Python port of the fastRhockey-nhl-data reshaper (final.json -> season datasets)"
requires-python = ">=3.10"
dependencies = [
    "polars>=1.0,<2.0",
    "pyarrow>=14.0",
    "numpy>=1.26",
    # native .rds writing (write_rds) so the python producer emits every released
    # format, not just parquet — matches R's .save_dataset (saveRDS + parquet).
    "sportsdataverse>=0.0.72",
]

[tool.uv.sources]
# write_rds(cls=) landed in sportsdataverse-py #274 (0.0.72), which is not on PyPI
# (latest published is 0.0.71) — track git main like the other -data producers.
sportsdataverse = { git = "https://github.com/sportsdataverse/sportsdataverse-py", branch = "main" }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
# xG model training (xg_train): xgboost + pandas (xgb.cv returns a pandas frame).
train = ["xgboost>=2.0", "pandas>=2.0"]
# optional feature-importance PNGs (xg_report.write_importance_figures).
figures = ["matplotlib>=3.7"]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Pinned rule set: relying on ruff defaults makes the gate version-sensitive.
select = ["E4", "E7", "E9", "F", "I"]
# Explicit polars bool masks (pl.col(...) == True) are the project convention.
ignore = ["E712"]
